<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPlate Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LOADER -->
    <div id="loader" class="text-center">
        <div class="text-4xl animate-bounce mb-2">🚘</div>
        <p class="text-xs text-slate-400">Loading AutoPlate...</p>
    </div>

    <!-- APP (Hidden until loaded) -->
    <div id="app" class="hidden w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <span id="userTag" class="font-bold text-sm text-cyan-400">@user</span>
            <div class="bg-slate-800 px-3 py-1 rounded-xl text-sm font-bold">
                ⭐ <span id="balance">10</span> stars
            </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-xl py-6 text-center text-3xl font-mono tracking-widest text-cyan-400 mb-6" id="plate">
            AA 7777 BB
        </div>

        <button onclick="spin()" id="spinBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3.5 rounded-xl transition-all shadow-lg">
            SPIN (5 ⭐)
        </button>
    </div>

    <script>
        const sb = window.supabase.createClient(
            'https://atbqzslhzbnmebdjonig.supabase.co',
            'Sb_publishable_zjI9RflUYr-eA5p7DrIB7w_l8nrnFiF'
        );

        let user = null;

        async function init() {
            // Беремо ID з Telegram або генеруємо тестовий
            let tgId = 'test_' + Math.floor(Math.random() * 90000 + 10000);
            let tgTag = '@test_user';

            if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
                tgId = String(Telegram.WebApp.initDataUnsafe.user.id);
                tgTag = '@' + (Telegram.WebApp.initDataUnsafe.user.username || 'user');
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            try {
                // Авторизація через базу
                let { data } = await sb.rpc('auth_user_tg', { p_telegram_id: tgId, p_telegram_tag: tgTag });
                if (data && data.success) user = data.user;
            } catch (e) {}

            // Аварійний обхід, якщо база не відповіла, щоб гра все одно працювала
            if (!user) {
                user = { id: '00000000-0000-0000-0000-000000000000', telegram_tag: tgTag, balance: 15, free_spins: 3 };
            }

            document.getElementById('userTag').textContent = user.telegram_tag;
            document.getElementById('balance').textContent = user.balance;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        async function spin() {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            try {
                let { data } = await sb.rpc('spin_wheel', { p_user_id: user.id, p_country: 'Ukraine' });
                if (data && data.success) {
                    document.getElementById('plate').textContent = data.plate;
                    user.balance = Math.max(0, user.balance - 5);
                    document.getElementById('balance').textContent = user.balance;
                } else {
                    alert(data?.error || 'Error');
                }
            } catch (e) {
                // Оффлайн симуляція прокруту
                document.getElementById('plate').textContent = 'UA 1234 KA';
            }
            btn.disabled = false;
        }

        window.onload = init;
    </script>
</body>
</html>
